spring:
  application:
    name: planner
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/planner}
    username: ${DATABASE_USERNAME:planner}
    password: ${DATABASE_PASSWORD:planner-local-password}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: reminder-worker-

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    by.korchagin.planner: ${APP_LOG_LEVEL:INFO}

planner:
  reminder:
    interpretation:
      time-zone: ${REMINDER_TIME_ZONE:Europe/Moscow}
    scheduling:
      enabled: ${REMINDER_SCHEDULING_ENABLED:true}
      initial-delay: ${REMINDER_SCHEDULING_INITIAL_DELAY:5s}
      enqueue-interval: ${REMINDER_ENQUEUE_INTERVAL:1s}
      send-interval: ${REMINDER_SEND_INTERVAL:1s}
