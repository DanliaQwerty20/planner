spring:
  application:
    name: planner
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/planner}
    username: ${DATABASE_USERNAME:planner}
    password: ${DATABASE_PASSWORD:planner-local-password}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: reminder-worker-

server:
  port: ${PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    by.korchagin.planner: ${APP_LOG_LEVEL:INFO}

planner:
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    update-mode: webhook
    polling-timeout: 10s
    polling-delay: 500ms
  voice:
    transcription:
      enabled: ${VOICE_TRANSCRIPTION_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      api-base-url: ${OPENAI_API_BASE_URL:https://api.openai.com}
      model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
      language: ${OPENAI_TRANSCRIPTION_LANGUAGE:ru}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
      read-timeout: ${OPENAI_READ_TIMEOUT:60s}
  reminder:
    interpretation:
      time-zone: ${REMINDER_TIME_ZONE:Europe/Moscow}
    scheduling:
      enabled: ${REMINDER_SCHEDULING_ENABLED:true}
      initial-delay: ${REMINDER_SCHEDULING_INITIAL_DELAY:5s}
      enqueue-interval: ${REMINDER_ENQUEUE_INTERVAL:1s}
      send-interval: ${REMINDER_SEND_INTERVAL:1s}
